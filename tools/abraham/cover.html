<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="utf-8">
  <title>ஆபிரகாம்: மணல் துகள்களின் பேரரசன்</title>
  <style>
    @font-face {
      font-family: "Noto Serif Tamil";
      src: url("file:///usr/share/fonts/truetype/noto/NotoSerifTamil-Bold.ttf") format("truetype");
      font-weight: 700;
    }
    @font-face {
      font-family: "Noto Serif Tamil";
      src: url("file:///usr/share/fonts/truetype/noto/NotoSerifTamil-Regular.ttf") format("truetype");
      font-weight: 400;
    }
    @font-face {
      font-family: "Noto Sans Tamil";
      src: url("file:///usr/share/fonts/truetype/noto/NotoSansTamil-Regular.ttf") format("truetype");
      font-weight: 400;
    }
    @font-face {
      font-family: "Noto Sans Tamil";
      src: url("file:///usr/share/fonts/truetype/noto/NotoSansTamil-Bold.ttf") format("truetype");
      font-weight: 700;
    }
    html, body { margin: 0; width: 1200px; height: 1700px; overflow: hidden; }
    body {
      font-family: "Noto Sans Tamil", sans-serif;
      color: #fbf7f1;
      background: #0e1a33;
    }
    .cover {
      width: 1200px;
      height: 1700px;
      position: relative;
      background:
        radial-gradient(900px 520px at 50% 18%, rgba(244, 214, 160, 0.16), transparent 60%),
        linear-gradient(180deg, #101a30 0%, #1a2744 46%, #c4a574 46.2%, #e7d3a8 100%);
    }
    svg.sky { position: absolute; inset: 0 0 auto 0; width: 1200px; height: 820px; }
    .zig {
      position: absolute;
      left: 180px;
      top: 430px;
      width: 840px;
      height: 340px;
    }
    .panel {
      position: absolute;
      left: 90px;
      right: 90px;
      top: 860px;
      bottom: 70px;
      background: #f7f1e6;
      color: #1a2030;
      border-radius: 8px;
      box-shadow: 0 18px 40px rgba(8, 14, 28, 0.28);
      padding: 64px 72px 48px;
      box-sizing: border-box;
    }
    .kicker {
      margin: 0;
      letter-spacing: 0.14em;
      font-size: 28px;
      font-weight: 700;
      color: #8a4e24;
    }
    h1 {
      font-family: "Noto Serif Tamil", serif;
      font-weight: 700;
      font-size: 84px;
      line-height: 1.15;
      margin: 12px 0 0;
      color: #12224a;
    }
    h1 span { display: block; font-size: 58px; margin-top: 6px; }
    .subta {
      margin: 22px 0 0;
      font-family: "Noto Serif Tamil", serif;
      font-size: 34px;
      line-height: 1.45;
      color: #3c4454;
    }
    .en {
      margin: 16px 0 0;
      font-family: "Palatino Linotype", Palatino, "Times New Roman", serif;
      font-size: 28px;
      color: #3c4454;
    }
    .rule {
      width: 180px;
      height: 4px;
      background: #a86b3c;
      margin: 36px 0;
      border: 0;
    }
    .author {
      font-family: "Noto Serif Tamil", serif;
      font-size: 40px;
      font-weight: 700;
      margin: 0;
      color: #12224a;
    }
    .pub {
      margin: 22px 0 0;
      font-size: 26px;
      line-height: 1.45;
      color: #3c4454;
    }
    .year {
      margin: 18px 0 0;
      font-size: 28px;
      font-weight: 700;
      color: #8a4e24;
    }
  </style>
</head>
<body>
  <div class="cover">
    <svg class="sky" viewBox="0 0 1200 820" aria-hidden="true">
      <g fill="#f4e2b0">
        <circle cx="120" cy="90" r="2.2"/><circle cx="210" cy="150" r="1.6"/>
        <circle cx="300" cy="70" r="2"/><circle cx="390" cy="180" r="1.4"/>
        <circle cx="470" cy="96" r="2.4"/><circle cx="560" cy="150" r="1.5"/>
        <circle cx="650" cy="64" r="1.8"/><circle cx="740" cy="130" r="2.2"/>
        <circle cx="830" cy="80" r="1.4"/><circle cx="920" cy="160" r="2"/>
        <circle cx="1010" cy="90" r="1.6"/><circle cx="1080" cy="150" r="2.2"/>
        <circle cx="160" cy="240" r="1.3"/><circle cx="250" cy="280" r="1.8"/>
        <circle cx="980" cy="250" r="1.5"/><circle cx="70" cy="200" r="1.2"/>
        <circle cx="1130" cy="220" r="1.4"/>
      </g>
    </svg>
    <svg class="zig" viewBox="0 0 840 340" aria-hidden="true">
      <polygon points="40,300 800,300 760,250 80,250" fill="#8d5a32"/>
      <polygon points="90,250 750,250 710,200 130,200" fill="#b07a45"/>
      <polygon points="150,200 690,200 650,150 190,150" fill="#c9955c"/>
      <polygon points="210,150 630,150 590,108 250,108" fill="#e0b778"/>
      <polygon points="400,108 470,108 455,78 415,78" fill="#f0d7a4"/>
      <polygon points="300,300 360,108 390,108 470,300" fill="#6e4124" opacity="0.35"/>
    </svg>
    <div class="panel">
      <p class="kicker">மூல நூல்</p>
      <h1>ஆபிரகாம்<span>மணல் துகள்களின் பேரரசன்</span></h1>
      <p class="subta">விசுவாசம், போர் மற்றும் தெய்வீகத் தேடலின் காவியம்</p>
      <p class="en">Abraham: Emperor of the Grains of Sand</p>
      <hr class="rule">
      <p class="author">நீலம் பி.ஜே.பிரதீப் ஜேசுதாஸ்</p>
      <p class="pub">ஜெய் பீம் எஜுகேஷனல் அண்ட் சேரிடபிள் டிரஸ்ட்<br>Jai Bhim Educational Charitable Trust</p>
      <p class="year">2026</p>
    </div>
  </div>
</body>
</html>
